spring:
  application:
    name: orchestapi
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/test}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
      default_schema: orchestrator
    open-in-view: false
    properties:
      hibernate:
        default_schema: orchestrator
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  flyway:
    enabled: true
    default-schema: orchestrator
    schemas: orchestrator
    table: orchestapi_flyway_history

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${CONTEXT_PATH:/}
  forward-headers-strategy: framework
  tomcat:
    # Keep Tomcat's context-root slash redirect, but emit a relative Location
    # (e.g. /orchestapi/) so browsers stay on the public host/scheme. Absolute
    # redirects behind Kong become http://idp.stg.sbuxcf.net/... and break
    # https://idp.stg.starbucks.net/orchestapi — same reason agent-session nginx
    # uses `return 302 ${FRONTEND_BASE_PATH}/` (relative) instead of an absolute URL.
    use-relative-redirects: true

orchestapi:
  oauth:
    enabled: ${ORCHESTAPI_OAUTH_ENABLED:false}
    token-endpoint: ${ORCHESTAPI_OAUTH_TOKEN_ENDPOINT:}
    client-id: ${ORCHESTAPI_OAUTH_CLIENT_ID:}
    client-secret: ${ORCHESTAPI_OAUTH_CLIENT_SECRET:}
    scopes: ${ORCHESTAPI_OAUTH_SCOPES:}
    audience: ${ORCHESTAPI_OAUTH_AUDIENCE:}
    client-auth-method: ${ORCHESTAPI_OAUTH_CLIENT_AUTH_METHOD:client_secret_basic}
    refresh-skew-seconds: ${ORCHESTAPI_OAUTH_REFRESH_SKEW_SECONDS:60}
    request-timeout-ms: ${ORCHESTAPI_OAUTH_REQUEST_TIMEOUT_MS:10000}
