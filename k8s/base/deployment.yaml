apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestapi
  labels:
    app.kubernetes.io/name: orchestapi
    app.kubernetes.io/component: application
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orchestapi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orchestapi
        app.kubernetes.io/component: application
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orchestapi
          image: orchestapi:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: SERVER_PORT
              value: "8080"
            - name: CONTEXT_PATH
              value: /orchestapi
            - name: JAVA_OPTS
              value: -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
            - name: ORCHESTAPI_OAUTH_ENABLED
              value: "false"
            - name: ORCHESTAPI_OAUTH_TOKEN_ENDPOINT
              value: ""
            - name: ORCHESTAPI_OAUTH_CLIENT_ID
              value: ""
            - name: ORCHESTAPI_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: orchestapi-oauth
                  key: client-secret
                  optional: true
            - name: ORCHESTAPI_OAUTH_SCOPES
              value: ""
            - name: ORCHESTAPI_OAUTH_AUDIENCE
              value: ""
            - name: ORCHESTAPI_OAUTH_CLIENT_AUTH_METHOD
              value: client_secret_basic
            - name: ORCHESTAPI_OAUTH_REFRESH_SKEW_SECONDS
              value: "60"
            - name: ORCHESTAPI_OAUTH_REQUEST_TIMEOUT_MS
              value: "10000"
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: orchestapi-db
                  key: DB_URL
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: orchestapi-db
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orchestapi-db
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
          startupProbe:
            httpGet:
              path: /orchestapi/actuator/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /orchestapi/actuator/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /orchestapi/actuator/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
